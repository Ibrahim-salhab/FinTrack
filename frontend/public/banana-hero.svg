<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F0F" />
      <stop offset="100%" stop-color="#1E1E1E" />
    </linearGradient>
    <linearGradient id="bananaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <linearGradient id="broadcastRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0000" />
      <stop offset="100%" stop-color="#CC0000" />
    </linearGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="600" height="400" rx="16" fill="url(#heroBg)" />

  <!-- Broadcast Live Badge Accent -->
  <rect x="40" y="40" width="60" height="24" rx="12" fill="url(#broadcastRed)" />
  <circle cx="52" cy="52" r="4" fill="#FFFFFF" />
  <text x="64" y="56" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LIVE</text>

  <!-- Subtle Financial Grid lines -->
  <g stroke="#333333" stroke-width="1" stroke-dasharray="4,4">
    <line x1="40" y1="120" x2="560" y2="120" />
    <line x1="40" y1="190" x2="560" y2="190" />
    <line x1="40" y1="260" x2="560" y2="260" />
    <line x1="40" y1="330" x2="560" y2="330" />
  </g>

  <!-- Glowing Trend Graph Line -->
  <path d="M 60 300 Q 140 280 200 220 T 320 200 T 440 140 T 540 100" fill="none" stroke="#2BA640" stroke-width="4" stroke-linecap="round" />
  <circle cx="540" cy="100" r="6" fill="#2BA640" />

  <!-- Center Floating Gemini Banana Hero Graphic -->
  <g transform="translate(250, 150) scale(1.6)">
    <!-- Shadow -->
    <ellipse cx="20" cy="65" rx="30" ry="8" fill="#000000" opacity="0.4" />
    <!-- Banana -->
    <path d="M -10 20 C 15 0, 50 10, 55 45 C 57 60, 42 70, 25 68 C 10 66, -3 50, 0 35 C 1 25, -4 22, -10 20 Z" 
          fill="url(#bananaGlow)" />
    <!-- Stem -->
    <path d="M -10 20 C -12 21, -15 23, -15 27 C -10 25, -7 22, -10 20 Z" fill="#6B4423" />
    <!-- Gemini Sparkles -->
    <path d="M 32 30 L 34 36 L 40 38 L 34 40 L 32 46 L 30 40 L 24 38 L 30 36 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M 12 45 L 13 49 L 17 50 L 13 51 L 12 55 L 11 51 L 7 50 L 11 49 Z" fill="#FFFFFF" opacity="0.75" />
  </g>

  <!-- Banner Typography -->
  <text x="40" y="340" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="22" font-weight="700">Gemini Banana</text>
  <text x="40" y="365" fill="#AAAAAA" font-family="Roboto, sans-serif" font-size="13" font-weight="400">Professional Personal Finance &amp; Budget Manager</text>

  <!-- Metric Badges -->
  <g transform="translate(420, 280)">
    <rect width="140" height="64" rx="8" fill="#1C1C1C" stroke="#333333" stroke-width="1" />
    <text x="16" y="26" fill="#888888" font-family="Roboto, sans-serif" font-size="11">TOTAL SAVED</text>
    <text x="16" y="48" fill="#2BA640" font-family="Roboto, sans-serif" font-size="18" font-weight="700">+34.8%</text>
  </g>
</svg>
