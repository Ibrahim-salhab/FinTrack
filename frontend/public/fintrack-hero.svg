<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F0F" />
      <stop offset="100%" stop-color="#1E1E1E" />
    </linearGradient>
    <linearGradient id="broadcastRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0000" />
      <stop offset="100%" stop-color="#CC0000" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222222" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="600" height="400" rx="16" fill="url(#heroBg)" />

  <!-- Broadcast Live Badge Accent -->
  <rect x="40" y="40" width="60" height="24" rx="12" fill="url(#broadcastRed)" />
  <circle cx="52" cy="52" r="4" fill="#FFFFFF" />
  <text x="64" y="56" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LIVE</text>

  <!-- Subtle Financial Grid lines -->
  <g stroke="#2C2C2C" stroke-width="1" stroke-dasharray="4,4">
    <line x1="40" y1="120" x2="560" y2="120" />
    <line x1="40" y1="190" x2="560" y2="190" />
    <line x1="40" y1="260" x2="560" y2="260" />
    <line x1="40" y1="330" x2="560" y2="330" />
  </g>

  <!-- Trend Graph Lines -->
  <path d="M 60 280 Q 140 260 200 200 T 320 180 T 440 120 T 540 80" fill="none" stroke="#2BA640" stroke-width="4" stroke-linecap="round" />
  <circle cx="540" cy="80" r="6" fill="#2BA640" />

  <path d="M 60 310 Q 140 300 200 280 T 320 250 T 440 220 T 540 180" fill="none" stroke="#FF0000" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Center Card Illustration -->
  <g transform="translate(180, 110)">
    <rect width="240" height="150" rx="16" fill="url(#cardGrad)" stroke="#383838" stroke-width="1.5" />
    <!-- FinTrack Icon inside card -->
    <rect x="24" y="24" width="40" height="40" rx="10" fill="#0F0F0F" stroke="#FF0000" stroke-width="1.5" />
    <path d="M 36 34 L 52 34 L 52 38 L 42 38 L 42 42 L 49 42 L 49 46 L 42 46 L 42 54 L 36 54 Z" fill="#FFFFFF" />
    <!-- Financial bars -->
    <rect x="80" y="32" width="120" height="8" rx="4" fill="#3A3A3A" />
    <rect x="80" y="48" width="80" height="6" rx="3" fill="#2BA640" />
    
    <line x1="24" y1="88" x2="216" y2="88" stroke="#333333" stroke-width="1" />
    
    <text x="24" y="112" fill="#888888" font-family="Roboto, sans-serif" font-size="10">BALANCE</text>
    <text x="24" y="132" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="18" font-weight="700">$24,850.00</text>
    <text x="160" y="132" fill="#2BA640" font-family="Roboto, sans-serif" font-size="12" font-weight="700">+18.4%</text>
  </g>

  <!-- Banner Typography -->
  <text x="40" y="340" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="22" font-weight="700">FinTrack</text>
  <text x="40" y="365" fill="#AAAAAA" font-family="Roboto, sans-serif" font-size="13" font-weight="400">Professional Personal Finance &amp; Budget Manager</text>

  <!-- Metric Badges -->
  <g transform="translate(420, 280)">
    <rect width="140" height="64" rx="8" fill="#1C1C1C" stroke="#333333" stroke-width="1" />
    <text x="16" y="26" fill="#888888" font-family="Roboto, sans-serif" font-size="11">TOTAL SAVED</text>
    <text x="16" y="48" fill="#2BA640" font-family="Roboto, sans-serif" font-size="18" font-weight="700">+34.8%</text>
  </g>
</svg>
